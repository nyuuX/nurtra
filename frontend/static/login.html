<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk — Nurtra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      .auth-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }
      .auth-card {
        width: 100%;
        max-width: 420px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 32px 28px;
        box-shadow: 0 20px 60px -20px rgba(2, 6, 23, 0.25);
      }
      .auth-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 4px;
      }
      .auth-brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        background: linear-gradient(135deg, #10b981, #059669);
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 800;
        font-size: 19px;
        letter-spacing: -0.04em;
      }
      .auth-brand-name {
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -0.03em;
      }
      .auth-title {
        font-size: 23px;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin: 18px 0 4px;
      }
      .auth-sub {
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 22px;
      }
      .auth-tabs {
        display: flex;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 4px;
        margin-bottom: 20px;
      }
      .auth-tab {
        flex: 1;
        text-align: center;
        padding: 9px 0;
        border-radius: 9px;
        font-weight: 700;
        font-size: 14px;
        color: var(--text-muted);
        cursor: pointer;
        border: 0;
        background: transparent;
        transition: all 0.15s ease;
      }
      .auth-tab.active {
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 1px 3px rgba(2, 6, 23, 0.14);
      }
      .auth-field {
        margin-bottom: 14px;
      }
      .auth-field label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
        color: var(--text-muted);
      }
      .auth-field input {
        width: 100%;
        padding: 11px 13px;
        border: 1px solid var(--border);
        border-radius: 10px;
        /* Card bg is var(--surface); surface-2 is nearly the same, so filled
           text disappeared into the field. Use the page bg instead so the
           input reads as a distinct inset control. */
        background: var(--bg);
        color: var(--text);
        font-size: 15px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
        box-sizing: border-box;
      }
      .auth-field input::placeholder {
        color: var(--text-muted);
        opacity: 0.75;
      }
      .auth-field input:focus {
        border-color: #10b981;
        /* Keep a distinct field bg on focus too, otherwise the focused
           field collapses back into the card. */
        background: var(--bg);
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.16);
      }
      html[data-theme="dark"] .auth-field input {
        /* --bg and --surface are close enough in dark mode that filled
           fields still blend in; lift the field one step lighter than
           the card so it reads as a distinct control. */
        background: var(--surface-2);
        border-color: var(--border);
      }
      .auth-error {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.35);
        color: #ef4444;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 13.5px;
        font-weight: 600;
        margin-bottom: 14px;
        display: none;
      }
      .auth-error.show {
        display: block;
      }
      .btn-auth {
        width: 100%;
        padding: 12px 0;
        font-size: 15px;
        font-weight: 800;
        border-radius: 11px;
        margin-top: 4px;
      }
      .auth-divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 20px 0;
        color: var(--text-muted);
        font-size: 12.5px;
        font-weight: 600;
      }
      .auth-divider::before,
      .auth-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }
      .btn-google {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 11px 0;
        border: 1px solid var(--border);
        border-radius: 11px;
        background: var(--surface-2);
        color: var(--text);
        font-size: 14.5px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        transition: background 0.15s ease;
      }
      .btn-google:hover {
        background: var(--surface);
      }
      .btn-google svg {
        width: 18px;
        height: 18px;
      }
      .auth-note {
        margin-top: 18px;
        text-align: center;
        font-size: 12.5px;
        color: var(--text-muted);
        line-height: 1.5;
      }
      .auth-note a {
        color: #10b981;
        font-weight: 700;
        text-decoration: none;
      }
      #btnGoogle span {
        color: var(--text-muted);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-brand">
          <div class="auth-brand-mark">D</div>
          <div class="auth-brand-name">Nurtra</div>
        </div>

        <h1 class="auth-title" id="authTitle">Masuk</h1>
        <p class="auth-sub" id="authSub">Lanjutkan pelacakan defisit kalorimu</p>

        <div class="auth-tabs">
          <button class="auth-tab active" id="tabLogin">Masuk</button>
          <button class="auth-tab" id="tabSignup">Daftar</button>
        </div>

        <form id="authForm" novalidate>
          <div class="auth-error" id="authError"></div>

          <div class="auth-field" id="nameWrap" hidden>
            <label for="authName">Nama</label>
            <input id="authName" type="text" placeholder="Budi Santoso" autocomplete="name" />
          </div>

          <div class="auth-field">
            <label for="authEmail">Email</label>
            <input
              id="authEmail"
              type="email"
              placeholder="kamu@email.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="auth-field">
            <label for="authPassword">Password</label>
            <input
              id="authPassword"
              type="password"
              placeholder="Minimal 6 karakter"
              autocomplete="current-password"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary btn-auth" id="btnAuth">
            Masuk
          </button>
        </form>

        <div class="auth-divider">atau</div>

        <button class="btn-google" id="btnGoogle">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            />
            <path
              fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            />
            <path
              fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
            />
            <path
              fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            />
          </svg>
          <span>Lanjutkan dengan Google</span>
        </button>

        <p class="auth-note">
          Belum punya akun?
          <a href="#" id="switchLink">Daftar gratis</a>
        </p>
        <p class="auth-note">
          <a href="/">← Kembali ke dashboard</a> &nbsp;·&nbsp; Data demo tetap bisa
          dipakai tanpa login
        </p>
      </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
